name: About Simple iPhone Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install WebKit test browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps webkit
      - name: Verify public hero interaction and unchanged game
        run: |
          cat > /tmp/about_check.py <<'PY'
          import time, urllib.request
          from playwright.sync_api import sync_playwright

          base='https://kanatama0416-glitch.github.io/about-shiten/'
          html=''
          for i in range(36):
              try:
                  html=urllib.request.urlopen(base+'?organic='+str(i),timeout=20).read().decode('utf-8','replace')
              except Exception:
                  html=''
              if '20260920-goal-cue-v1' in html:
                  break
              time.sleep(5)
          assert '20260920-goal-cue-v1' in html
          assert 'hero-click-guide' not in html
          assert 'hero-click-speech' not in html
          assert 'タップ！' not in html
          assert 'game-simple-v5.js?v=3' in html
          assert "startFromDownGaze" in html
          assert "game.start()" in html

          js=urllib.request.urlopen(base+'game-simple-v5.js?unchanged=1',timeout=20).read().decode('utf-8','replace')
          assert 'window.__ABOUT_SIMPLE_GAME__' in js
          assert 'function resolveObstacle' in js
          assert 'function textRects' in js
          assert 'ballVY=-Math.max(320,Math.abs(ballVY)*.72)' in js
          assert "shiten-about-personal-best-v1" in js
          assert 'function readBestTime' in js and 'function writeBestTime' in js
          assert 'NEW BEST!' in js and 'best-row' in js
          assert 'function updateGoalCue' in js
          assert "goal.classList.add('game-target')" in js
          assert ".goal-eye.game-target.is-near .goal-pupil{width:68px;height:68px}" in js
          exact_goal_hit="""function goalHit(){
  const r=goal.getBoundingClientRect();
  const gx=r.left+r.width/2+scrollX,gy=r.top+r.height/2+scrollY;
  const rx=Math.max(28,r.width*.30),ry=Math.max(20,r.height*.27);
  const nx=(ballX-gx)/rx,ny=(ballY-gy)/ry;
  return nx*nx+ny*ny<=1?{gx,gy}:null;
}"""
          assert exact_goal_hit in js
          assert 'releaseIfStuck' not in js
          assert 'scrollTo(' not in js and 'scrollBy(' not in js

          with sync_playwright() as pw:
              browser=pw.webkit.launch()
              device=pw.devices['iPhone 13']
              ctx=browser.new_context(**device)

              # 1) No text guide; idle eye cue is visible but does not start the game.
              page=ctx.new_page()
              page.goto(base+'?test=organic-idle',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('window.__ABOUT_SIMPLE_GAME__ && window.__ABOUT_SIMPLE_GAME__.getState')
              assert page.locator('.hero-click-guide').count()==0
              pupil=page.locator('#heroPupil')
              t0=pupil.evaluate("e=>getComputedStyle(e).transform")
              time.sleep(1.55)
              t1=pupil.evaluate("e=>getComputedStyle(e).transform")
              time.sleep(.35)
              t2=pupil.evaluate("e=>getComputedStyle(e).transform")
              assert len({t0,t1,t2})>1,(t0,t1,t2)
              assert page.evaluate("document.body.classList.contains('game-running')") is False

              # 2) Horizontal touch drag moves the pupil freely and does not start the game.
              pr=pupil.bounding_box(); assert pr
              cx=pr['x']+pr['width']/2; cy=pr['y']+pr['height']/2
              page.evaluate("""([x,y])=>{
                const el=document.getElementById('heroPupil');
                el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',pointerId:71,isPrimary:true,clientX:x,clientY:y}));
                el.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'touch',pointerId:71,isPrimary:true,clientX:x+72,clientY:y+8}));
                el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch',pointerId:71,isPrimary:true,clientX:x+72,clientY:y+8}));
              }""",[cx,cy])
              time.sleep(.3)
              moved=pupil.evaluate("e=>getComputedStyle(e).transform")
              assert moved!=t2,(t2,moved)
              assert page.evaluate("document.body.classList.contains('game-running')") is False
              page.close()

              # 3) Looking/dragging downward starts the existing game.
              page=ctx.new_page()
              page.goto(base+'?test=down-gaze',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('window.__ABOUT_SIMPLE_GAME__ && window.__ABOUT_SIMPLE_GAME__.getState')
              pupil=page.locator('#heroPupil')
              goal=page.locator('#goalEye')
              goal_pupil=page.locator('#goalPupil')
              goal_before=goal.bounding_box(); assert goal_before
              pr=pupil.bounding_box(); assert pr
              cx=pr['x']+pr['width']/2; cy=pr['y']+pr['height']/2
              page.evaluate("""([x,y])=>{
                const el=document.getElementById('heroPupil');
                el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',pointerId:72,isPrimary:true,clientX:x,clientY:y}));
                el.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'touch',pointerId:72,isPrimary:true,clientX:x,clientY:y+180}));
              }""",[cx,cy])
              page.wait_for_function("window.__ABOUT_SIMPLE_GAME__.getState().running===true")
              page.wait_for_function("document.getElementById('goalEye').classList.contains('game-target')")
              goal_after=goal.bounding_box(); assert goal_after
              assert abs(goal_after['width']-goal_before['width'])<0.5,(goal_before,goal_after)
              assert abs(goal_after['height']-goal_before['height'])<0.5,(goal_before,goal_after)
              gp_transform=goal_pupil.evaluate("e=>getComputedStyle(e).transform")
              assert gp_transform!='none',gp_transform
              assert float(goal_pupil.evaluate("e=>getComputedStyle(e).opacity"))>.99
              s0=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              time.sleep(.65)
              s1=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              assert s1['ballY']>s0['ballY']+8,(s0,s1)
              assert s1['obstacles']>10 and s1['checkpoints']>=5,s1

              # Existing in-game steering still works.
              vx=s1['ballX']-page.evaluate('window.scrollX')
              vy=min(650,max(250,s1['ballY']-page.evaluate('window.scrollY')))
              page.evaluate("""([x,y])=>{
                const t=document.elementFromPoint(x,y)||document.body;
                t.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',pointerId:31,isPrimary:true,clientX:x,clientY:y}));
                t.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'touch',pointerId:31,isPrimary:true,clientX:x+70,clientY:y+2}));
                t.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch',pointerId:31,isPrimary:true,clientX:x+70,clientY:y+2}));
              }""",[vx,vy])
              s2=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              assert s2['ballX']>s1['ballX']+40,(s1,s2)

              # Existing bottom bounce still works.
              page.evaluate('window.__ABOUT_SIMPLE_GAME__.testFloorBounce()')
              time.sleep(.12)
              sb=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              assert sb['ballVY']<-250,sb
              page.close()

              # 4) Tap start remains available, and the first clear stores a personal best.
              page=ctx.new_page()
              page.goto(base+'?test=tap-start-best',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('window.__ABOUT_SIMPLE_GAME__ && window.__ABOUT_SIMPLE_GAME__.getState')
              page.evaluate("localStorage.removeItem('shiten-about-personal-best-v1')")
              page.locator('#heroPupil').tap()
              page.wait_for_function("window.__ABOUT_SIMPLE_GAME__.getState().running===true")
              st=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              page.evaluate("""s=>{
                const g=document.getElementById('goalEye');
                g.style.position='fixed';g.style.width='300px';g.style.height='300px';
                g.style.left=(s.ballX-window.scrollX-150)+'px';
                g.style.top=(s.ballY-window.scrollY-150)+'px';
              }""",st)
              page.wait_for_selector('.game-result.show',timeout=5000)
              result_text=page.locator('.game-result').inner_text()
              assert 'BEST' in result_text and 'NEW BEST!' in result_text,result_text
              stored=page.evaluate("Number(localStorage.getItem('shiten-about-personal-best-v1'))")
              assert stored>0,stored
              page.close()

              # 5) An existing faster best is preserved and displayed after a slower clear.
              page=ctx.new_page()
              page.goto(base+'?test=best-persists',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('window.__ABOUT_SIMPLE_GAME__ && window.__ABOUT_SIMPLE_GAME__.getState')
              page.evaluate("localStorage.setItem('shiten-about-personal-best-v1','0.01')")
              page.locator('#heroPupil').tap()
              page.wait_for_function("window.__ABOUT_SIMPLE_GAME__.getState().running===true")
              time.sleep(.08)
              st=page.evaluate('window.__ABOUT_SIMPLE_GAME__.getState()')
              page.evaluate("""s=>{
                const g=document.getElementById('goalEye');
                g.style.position='fixed';g.style.width='300px';g.style.height='300px';
                g.style.left=(s.ballX-window.scrollX-150)+'px';
                g.style.top=(s.ballY-window.scrollY-150)+'px';
              }""",st)
              page.wait_for_selector('.game-result.show',timeout=5000)
              result_text=page.locator('.game-result').inner_text()
              assert 'BEST' in result_text and '0.01' in result_text,result_text
              assert 'NEW BEST!' not in result_text,result_text
              stored=page.evaluate("localStorage.getItem('shiten-about-personal-best-v1')")
              assert stored=='0.01',stored
              print('ABOUT_PERSONAL_BEST_AND_GAME_OK')
              page.close()
              browser.close()
          PY
          python /tmp/about_check.py
