name: Live Shiten Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Verify live pages
        run: |
          sleep 20
          cat > /tmp/check.py <<'PY'
          import time, urllib.request
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.common.action_chains import ActionChains

          base='https://kanatama0416-glitch.github.io/'
          # Verify the served 04 HTML itself: standard intro present, custom preboot absent,
          # and runtime core fetch removed.
          raw=urllib.request.urlopen(base+'person4-shiten/?rawcheck=1',timeout=20).read().decode('utf-8','replace')
          assert 'id="intro"' in raw
          assert 'intro-title">視展' in raw
          assert 'p4Preboot' not in raw
          assert "fetch('./core.html'" not in raw
          print('PERSON4_STATIC_HTML_OK',len(raw))

          o=webdriver.ChromeOptions()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=390,844']:
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          d.set_page_load_timeout(30)
          W=WebDriverWait(d,25)

          # About: wait until the newest public build is actually served.
          live_about=''
          for attempt in range(18):
              live_about=urllib.request.urlopen(base+'about-shiten/?buildcheck=20260919-iphone-stable-v6-'+str(attempt),timeout=20).read().decode('utf-8','replace')
              if '20260919-iphone-stable-v6' in live_about and "coarsePointer=window.matchMedia('(pointer:coarse)').matches" in live_about:
                  break
              time.sleep(5)
          assert '20260919-iphone-stable-v6' in live_about
          assert "coarsePointer=window.matchMedia('(pointer:coarse)').matches" in live_about
          assert "if(coarsePointer){targetX=0;targetY=0}" in live_about
          assert 'game-mobile-stable-v6.js' in live_about
          assert 'secret-guide-desktop-v6.js' in live_about
          print('ABOUT_LIVE_BUILD_OK',len(live_about))

          # About mobile stability: emulate an iPhone-class touch viewport.
          mo=webdriver.ChromeOptions()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage']:
              mo.add_argument(a)
          mo.add_experimental_option('mobileEmulation',{
              'deviceMetrics':{'width':390,'height':844,'pixelRatio':3.0,'mobile':True,'touch':True},
              'userAgent':'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          })
          md=webdriver.Chrome(options=mo)
          md.set_page_load_timeout(30)
          md.get(base+'about-shiten/?smoke=iphone-stable-v6')
          MW=WebDriverWait(md,25)
          MW.until(lambda x:x.find_element(By.ID,'heroEye'))
          MW.until(lambda x:x.execute_script('return window.__ABOUT_MOBILE_TOUCH===true'))
          MW.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.view-click-guide'))==1)
          assert md.execute_script("return /iPhone|iPad|iPod/.test(navigator.userAgent)") is True
          body=md.find_element(By.TAG_NAME,'body')
          pupil=md.find_element(By.ID,'heroPupil')
          drift=md.find_element(By.CSS_SELECTOR,'.de1')
          iris=md.find_element(By.CSS_SELECTOR,'.card-iris')
          guide=md.find_element(By.CSS_SELECTOR,'.view-click-guide')
          guide_label=md.find_element(By.CSS_SELECTOR,'.view-click-guide .guide-label')

          def state(el):
              return md.execute_script("""
                const r=arguments[0].getBoundingClientRect(),s=getComputedStyle(arguments[0]);
                return [r.left,r.top,r.width,r.height,s.transform,s.animationName,s.marginTop,s.opacity];
              """,el)

          sy0=md.execute_script('return window.scrollY')
          states0=[state(pupil),state(drift),state(iris),state(guide),state(guide_label)]
          time.sleep(3.2)
          sy1=md.execute_script('return window.scrollY')
          states1=[state(pupil),state(drift),state(iris),state(guide),state(guide_label)]
          assert 'game-running' not in (body.get_attribute('class') or '')
          assert abs(sy1-sy0)<1,(sy0,sy1)
          for a,b in zip(states0,states1):
              for i in range(4):
                  assert abs(a[i]-b[i])<0.5,(a,b)
              assert a[4:]==b[4:],(a,b)
          assert state(drift)[5]=='none',state(drift)
          assert state(iris)[5]=='none',state(iris)
          assert state(guide_label)[5]=='none',state(guide_label)
          assert not md.find_elements(By.CSS_SELECTOR,'.secret-trail')
          print('ABOUT_IPHONE_ALL_IDLE_ELEMENTS_STILL_OK',sy0,states1)

          # Scrolling to the bottom and tapping the goal must not move the page by script.
          md.execute_script('window.scrollTo(0, document.documentElement.scrollHeight)')
          time.sleep(.4)
          before_goal=md.execute_script('return window.scrollY')
          goal=md.find_element(By.ID,'goalEye')
          md.execute_script('arguments[0].click()',goal)
          time.sleep(1.4)
          after_goal=md.execute_script('return window.scrollY')
          assert abs(after_goal-before_goal)<2,(before_goal,after_goal)
          assert 'game-running' not in (body.get_attribute('class') or '')
          print('ABOUT_IPHONE_GOAL_NO_AUTO_SCROLL_OK',before_goal,after_goal)

          # Return to top. A deliberate touch tap on the black pupil starts the game.
          md.execute_script('window.scrollTo(0,0)')
          time.sleep(.3)
          pupil=md.find_element(By.ID,'heroPupil')
          r=md.execute_script('return arguments[0].getBoundingClientRect()',pupil)
          cx=r['left']+r['width']/2; cy=r['top']+r['height']/2
          md.execute_script("""
            const el=arguments[0],x=arguments[1],y=arguments[2];
            el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',pointerId:7,clientX:x,clientY:y,isPrimary:true}));
            el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch',pointerId:7,clientX:x,clientY:y,isPrimary:true}));
          """,pupil,cx,cy)
          MW.until(lambda x:'game-running' in (x.find_element(By.TAG_NAME,'body').get_attribute('class') or ''))
          ball=MW.until(lambda x:x.find_element(By.CSS_SELECTOR,'.game-ball.on'))
          time.sleep(.22)
          x0=md.execute_script('return arguments[0].getBoundingClientRect().left',ball)
          y0=md.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          time.sleep(.55)
          x1=md.execute_script('return arguments[0].getBoundingClientRect().left',ball)
          y1=md.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          assert abs(x1-x0)<1.5,(x0,x1,y0,y1)
          assert y1>y0+8,(x0,x1,y0,y1)
          print('ABOUT_IPHONE_GAME_NO_AUTO_HORIZONTAL_DRIFT_OK',x0,x1,y0,y1)
          md.quit()

          # About: confirm actual acceleration and no invisible 74% gate.
          d.get(base+'about-shiten/?smoke=freefall-final2')
          hero=W.until(lambda x:x.find_element(By.ID,'heroEye'))
          ActionChains(d).move_to_element(hero).click().perform()
          W.until(lambda x:'game-running' in (x.find_element(By.TAG_NAME,'body').get_attribute('class') or ''))
          ball=d.find_element(By.CSS_SELECTOR,'.game-ball')
          time.sleep(.20)
          y0=d.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          time.sleep(.14)
          y1=d.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          time.sleep(.14)
          y2=d.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          first=y1-y0; second=y2-y1
          assert first>1,(y0,y1,y2)
          assert second>first+1,(first,second,y0,y1,y2)
          time.sleep(.40)
          y3=d.execute_script('return arguments[0].getBoundingClientRect().top',ball)
          vh=d.execute_script('return window.innerHeight')
          assert y3>vh*.74,(y3,vh)
          print('ABOUT_FREE_FALL_OK',round(first,2),round(second,2),round(y3,2),vh)

          # 03 -> 04: measure time to the actual page DOM.
          d.get(base+'person3-shiten/?smoke=p4-static-final2')
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'main.page'))>0)
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.intro'))==0)
          link=W.until(lambda x: next((e for e in x.find_elements(By.CSS_SELECTOR,'a.v') if 'person4-shiten' in (e.get_attribute('href') or '')),None))
          started=time.perf_counter()
          d.execute_script('arguments[0].click()',link)
          W.until(lambda x:'person4-shiten' in x.current_url)
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'main.page'))>0)
          ready=time.perf_counter()-started
          assert not d.find_elements(By.ID,'p4Preboot')
          assert ready<1.5,ready
          print('03_TO_04_STATIC_READY_OK',round(ready,3))

          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.intro'))==0)
          btn=W.until(lambda x:x.find_element(By.ID,'tearToggle'))
          btn.click()
          garden=d.find_element(By.ID,'p4Garden')
          W.until(lambda x:garden.get_attribute('data-stage')=='complete')
          page=d.find_element(By.CSS_SELECTOR,'main.page')
          svg=d.find_element(By.ID,'p4GardenSvg')
          page_h=d.execute_script('return arguments[0].scrollHeight',page)
          garden_h=d.execute_script('return arguments[0].getBoundingClientRect().height',garden)
          svg_h=d.execute_script('return arguments[0].getBoundingClientRect().height',svg)
          flowers=d.find_elements(By.CSS_SELECTOR,'.p4-flower')
          assert garden_h>=page_h-8,(garden_h,page_h)
          assert svg_h>=page_h-8,(svg_h,page_h)
          assert flowers and float(flowers[-1].value_of_css_property('opacity'))>0.85
          print('PERSON4_FULL_GARDEN_OK',garden_h,svg_h,page_h)
          d.quit()
          PY
          python /tmp/check.py
